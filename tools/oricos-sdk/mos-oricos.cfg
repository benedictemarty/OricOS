# Clang arguments for the OricOS platform (ADR-05 v2).
# OricOS apps = mode N 8-bit native (M=1, X=1), mono-bank ≤ 64 KiB.
# CPU : 65C816 (mosw65816), mode N permanent après XCE kernel.

# Platform include + lib paths.
-isystem <CFGDIR>/../mos-platform/oricos/include
-L<CFGDIR>/../mos-platform/oricos/lib

# 65C816 mode N 8-bit (ADR-05 v2)
-mcpu=mosw65816
-D__ORICOS__
-D__65C816__

# LTO pour optimisation maximale (code 8-bit compact)
-flto

# Platform parent (chemins communs, imag-regs.ld, text.ld, etc.)
@mos-common.cfg
