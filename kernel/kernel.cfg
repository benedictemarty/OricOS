# ld65 linker config for OricOS kernel.
# Cible : flat binary chargeable en bank 1 $0200 (cf. MEMORY_MAP.md).
#
# Layout v0.2 (Sprint 1.a) :
#   $0200..$54FF  CODE (boot + main loop)
#   $5500..$55FF  NMI_HANDLER (bank 1 NMI service)
#   $5600..        IRQ_HANDLER (Sprint 1.b)

MEMORY {
    BANK1: start = $0200, size = $E000, type = rw, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:        load = BANK1, type = ro, define = yes;
    NMI_HANDLER: load = BANK1, type = ro, start = $5500;
    IRQ_HANDLER: load = BANK1, type = ro, start = $5600;
    COP_HANDLER:    load = BANK1, type = ro, start = $5700;
    SYSCALL_TABLE:  load = BANK1, type = ro, start = $5750;
    CHARSET:        load = BANK1, type = ro, start = $5800;
    # SP-3.o S.6 : images d'apps (.incbin) sorties du CODE vers un segment haut,
    # au-dessus de toutes les données runtime (plus haute = SENTINEL $6314). Le
    # CODE retrouve de la marge sous son plafond $5400 (données TICK_COUNTER).
    BUNDLES:        load = BANK1, type = ro, start = $7000;
    # SP-3.p (suite GUI) : code toolkit additionnel + tables de fonte. Zone
    # $9200-$EDFF vierge (au-dessus de IRQ_ZP_SAVE $919x, sous les flags TC
    # $EE00+ qui sont runtime-only). CODE est plein (~94 o de marge sous
    # $5500) — les nouvelles routines GUI vont ici.
    GUICODE:        load = BANK1, type = ro, start = $9200;
    # SP-GUI (fontes multiples) : variante grasse de la fonte XVGA (1 Ko).
    # Adresse FIXE $D000 (zone GUICODE vierge, au-dessus du code toolkit
    # ~$A0C6, sous le plafond binaire $E1FF) → source d'upload STABLE
    # (CHARSET_XVGA_BOLD_SRC = $01D000), jamais réécrite avant le boot
    # upload (contrairement à une extension de CHARSET qui heurterait
    # SENTINEL $6300, écrit tôt au boot).
    FONTBOLD:       load = BANK1, type = ro, start = $D000;
}
