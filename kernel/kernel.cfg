# ld65 linker config for OricOS kernel (Sprint 0)
#
# Le kernel se charge en bank 1 $0200 (cf. docs/MEMORY_MAP.md). On
# produit un binaire flat aligné, qui sera chargé par Phosphoric en
# bank 1 via memory_write24() ou par le bootloader HDL ULX3S.
#
# Pour v0.1 (hello world), on n'a qu'un segment CODE.

MEMORY {
    KERNEL: start = $0200, size = $E000, type = rw, file = %O, fill = no;
}

SEGMENTS {
    CODE: load = KERNEL, type = ro;
}

# Pas de feature CART/STARTUP — on est en flat binary brut.
